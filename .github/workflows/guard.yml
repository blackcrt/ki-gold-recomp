name: guard

# Re-runs the legal guard on GitHub, so nothing slips through
# even if the local pre-commit hook was skipped.
on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/guard.py --all

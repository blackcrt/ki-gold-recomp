# N64Recomp config for Killer Instinct Gold (US V1.2).
# Turns the game's MIPS code into C in RecompiledFuncs/ (generated, never committed).
#
# Run it with:  python3 tools/regen.py
# Do not run N64Recomp by hand: the ROM, the split and the symbol file must be
# fresh first, and regen.py does those steps in order.
#
# Format checked against N64Recomp's src/config.cpp. Paths are relative to this file.

[input]
# First instruction the game runs, the start of the boot segment.
entrypoint = 0x80000400
# Decompressed ROM written by tools/unpack_rom.py. Game data, never committed.
rom_file_path = "build/kigold.decompressed.z64"
# Function names, addresses and sizes, written by tools/gen_symbols.py.
symbols_file_path = "syms/dump.toml"
output_func_path = "RecompiledFuncs"

[patches]
# A stubbed function gets an empty body: calling it does nothing.
# Every stub here is a known gap, not a fix. Each needs a real answer before
# the game can rely on that function. Reasons marked "N64Recomp:" are the
# error it prints when the stub is removed (checked 2026-10-10).
stubs = [
    # ---- stream1 ----
    # N64Recomp: "Unhandled branch in func_80030EF0 at 0x80030F58 to 0x80031028".
    # It branches out of itself to a label inside another function.
    "func_80030EF0",

    # ---- stream3 (hand-written assembly, option A in PLAN.md) ----
    # func_801AE6B4_stream3, the tail of the frame entry at 0x801AE460, was a
    # stub here until task 7t. It is translated now, see the two instruction
    # patches below.

    # N64Recomp: "Failed to determine size of jump table" for the next five.
    # They jump through hand-made address tables (table address in brackets).
    "func_801AFD44_stream3", # [0x801C52A4]
    "func_801AFE98_stream3", # [0x801B5B64]
    "func_801BCC84_stream3", # [0x801C4604]
    "func_801C0B5C_stream3", # [0x801C0E3C]
    "func_801C0BB4_stream3", # [0x801C0F08]

    # N64Recomp: "Unhandled cop0 register in mfc0: 9" for the next two.
    # They read the CPU's Count register (a hardware timer).
    "func_801B6578_stream3",
    "func_801B8F00_stream3",

    # ---- boot: libultra debug link, stubbed by choice ----
    # N64Recomp can translate these three. They are stubbed because they talk
    # to a development kit at 0xC0000000 that a retail console does not have,
    # and they call __osGetCause, which N64Recomp skips and gives no body.
    # Stubbing them removes those calls. See NOTES.md, 2026-10-10, task 2.
    # Assumption, not proven until the game runs: retail code never needs them.
    "__osSyncPutChars", # proven name; nothing in the game calls it
    "func_80005D98",    # unnamed (lead: send_packet); writes a packet, waits on Cause
    "func_80005E58",    # unnamed (lead: send); calls func_80005D98 3 bytes at a time
]

# An instruction patch replaces one instruction of the game before N64Recomp
# translates it. value is the new instruction as a 32-bit number.
#
# The frame tail (func_801AE6B4_stream3) puts the stack pointer back from
# 0x801D9FF8 and uses $sp itself as the scratch register for that address:
#     0x801AE6B4: lui $sp, 0x801E          (0x3C1D801E)
#     0x801AE6B8: lw  $sp, -0x6008($sp)    (0x8FBD9FF8)
# N64Recomp stops on the second one ("Negative offset for lw from stack: -24584"),
# because it reads every lw with $sp as base as a stack slot. These two patches
# use $at as the scratch register instead. The result in $sp is the same, and
# $at is reloaded from the stack a few lines later (0x801AE704), so nothing
# else changes.
[[patches.instruction]]
func = "func_801AE6B4_stream3"
vram = 0x801AE6B4
value = 0x3C01801E # lui $at, 0x801E

[[patches.instruction]]
func = "func_801AE6B4_stream3"
vram = 0x801AE6B8
value = 0x8C3D9FF8 # lw $sp, -0x6008($at)

# A hook adds one line of C to a generated function. N64Recomp writes it on every
# regeneration, at the start of the function or before the instruction at
# before_vram. The first four call our code in src/game/inflate_hooks.cpp, which tells
# the runtime when the game has inflated one of its three code streams.

# Remember which ROM offset each buffer was filled from (both ROM read helpers).
[[patches.hook]]
func = "boot_rom_read"
text = "{ extern void kigold_on_rom_read(uint8_t* rdram, recomp_context* ctx); kigold_on_rom_read(rdram, ctx); }"

[[patches.hook]]
func = "func_800007B4"
text = "{ extern void kigold_on_rom_read(uint8_t* rdram, recomp_context* ctx); kigold_on_rom_read(rdram, ctx); }"

# Start of the inflate helper: identify the stream and load its functions.
[[patches.hook]]
func = "boot_inflate"
text = "{ extern void kigold_on_inflate_start(uint8_t* rdram, recomp_context* ctx); kigold_on_inflate_start(rdram, ctx); }"

# Just before the inflate helper returns (its jr ra): the developer-only check.
[[patches.hook]]
func = "boot_inflate"
before_vram = 0x80000950
text = "{ extern void kigold_on_inflate_end(uint8_t* rdram, recomp_context* ctx); kigold_on_inflate_end(rdram, ctx); }"

# Start of each code stream's first function: one log line, to show how far a run gets.
[[patches.hook]]
func = "stream1_entry"
text = "{ extern void kigold_on_stream_entry(uint8_t* rdram, recomp_context* ctx, int stream); kigold_on_stream_entry(rdram, ctx, 1); }"

[[patches.hook]]
func = "stream2_entry"
text = "{ extern void kigold_on_stream_entry(uint8_t* rdram, recomp_context* ctx, int stream); kigold_on_stream_entry(rdram, ctx, 2); }"

[[patches.hook]]
func = "stream3_entry"
text = "{ extern void kigold_on_stream_entry(uint8_t* rdram, recomp_context* ctx, int stream); kigold_on_stream_entry(rdram, ctx, 3); }"

# Just before stream3's first function writes the CPU's status register (its
# mtc0 at 0x801AD9F0, value in $v1): let our code in src/game/status_reg.cpp
# accept the "FPU usable" bit. Without it the runtime calls exit() there.
[[patches.hook]]
func = "stream3_entry"
before_vram = 0x801AD9F0
text = "{ extern void kigold_before_status_write(recomp_context* ctx, gpr value); kigold_before_status_write(ctx, ctx->r3); }"

# The stream3 frame (entry at 0x801AE460, tail at 0x801AE6B4). Three places in
# stream3 jump straight into the tail to end the frame early. On the N64 that
# leaves the frame at once. Our translated code returns to the caller instead,
# which is wrong when the jump comes from inside a routine the entry called
# (NOTES.md, tasks 7s and 7t). These five hooks call src/game/frame_tail.cpp,
# which logs every such jump and counts them for the heartbeat.
[[patches.hook]]
func = "func_801AE460_stream3"
text = "{ extern void kigold_on_frame_enter(void); kigold_on_frame_enter(); }"

[[patches.hook]]
func = "func_801AE6B4_stream3"
text = "{ extern void kigold_on_frame_tail(void); kigold_on_frame_tail(); }"

# The three jumps (j func_801AE6B4_stream3).
[[patches.hook]]
func = "func_801BD9EC_stream3"
before_vram = 0x801BDA40
text = "{ extern void kigold_on_frame_abort_jump(uint32_t from); kigold_on_frame_abort_jump(0x801BDA40); }"

[[patches.hook]]
func = "func_801BDA58_stream3"
before_vram = 0x801BDC28
text = "{ extern void kigold_on_frame_abort_jump(uint32_t from); kigold_on_frame_abort_jump(0x801BDC28); }"

[[patches.hook]]
func = "func_801BDC30_stream3"
before_vram = 0x801BDC34
text = "{ extern void kigold_on_frame_abort_jump(uint32_t from); kigold_on_frame_abort_jump(0x801BDC34); }"

# Two computed jumps in stream1 (func_80032200 and func_800323A4): a "jr $t5"
# into the middle of a run of 7 stores, so that only the stores still needed
# run. N64Recomp turns such a jr into a lookup of a function at that address,
# which fails ("Failed to find function at 0x800322EC", run 12). Each hook sits
# just before the jr, lets our code in src/game/computed_jump.cpp do the stores
# from the target on, and returns from the function, as the "jr $ra" at the end
# of the run would. Checked against the game's instructions by tools/jumptest.
[[patches.hook]]
func = "func_80032200"
before_vram = 0x800322DC
text = "{ extern void kigold_computed_jump_800322DC(uint8_t* rdram, recomp_context* ctx); kigold_computed_jump_800322DC(rdram, ctx); return; }"

[[patches.hook]]
func = "func_800323A4"
before_vram = 0x80032424
text = "{ extern void kigold_computed_jump_80032424(uint8_t* rdram, recomp_context* ctx); kigold_computed_jump_80032424(rdram, ctx); return; }"
